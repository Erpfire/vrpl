<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Login - VRPL">
  <title>Admin Login - VRPL</title>

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--steel-gray), var(--charcoal));
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--pattern-hexagon);
      opacity: 0.05;
    }

    .login-box {
      background: linear-gradient(145deg, var(--steel-gray), var(--background-light));
      border: 1px solid var(--copper-medium);
      border-radius: var(--radius-lg);
      padding: var(--space-3xl);
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-xl);
      position: relative;
      z-index: 1;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--copper-medium), var(--light-green));
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }

    .login-title {
      font-size: var(--text-2xl);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
    }

    .login-subtitle {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-label {
      display: block;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
    }

    .form-input {
      width: 100%;
      padding: var(--space-md);
      background: var(--background-dark);
      border: 1px solid var(--copper-medium);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-base);
      transition: all var(--transition-base);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--light-green);
      box-shadow: var(--shadow-glow-green);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .login-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-lg);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .remember-me label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .forgot-password {
      color: var(--copper-light);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }

    .forgot-password:hover {
      color: var(--light-green);
    }

    .btn-copper {
      width: 100%;
      padding: var(--space-md);
      background: linear-gradient(135deg, var(--copper-medium), var(--copper-light));
      border: none;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: all var(--transition-base);
    }

    .btn-copper:hover {
      box-shadow: var(--shadow-glow-green);
      transform: translateY(-2px);
    }

    .btn-copper:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      margin-top: var(--space-xl);
      padding-top: var(--space-lg);
      border-top: 1px solid var(--copper-medium);
    }

    .login-footer a {
      color: var(--copper-light);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: color var(--transition-fast);
    }

    .login-footer a:hover {
      color: var(--light-green);
    }

    .error-message {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff4444;
      color: #ff6b6b;
      padding: var(--space-md);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-lg);
      font-size: var(--text-sm);
      display: none;
    }

    .error-message.visible {
      display: block;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .loading {
      position: relative;
      pointer-events: none;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: var(--space-2xl);
        margin: var(--space-md);
      }

      .login-title {
        font-size: var(--text-xl);
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">VRPL Blog Management System</p>
      </div>

      <form id="loginForm">
        <div id="errorMessage" class="error-message"></div>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter your username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="login-actions">
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-copper" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html">&larr; Back to website</a>
      </div>
    </div>
  </div>

  <script src="js/admin-auth.js"></script>
</body>

</html>
