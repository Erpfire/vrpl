<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VRPL Blog - Latest news and updates on waste-to-energy technology, plasma gasification, and sustainability initiatives">
  <title>Blog - VRPL</title>

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>

  <header class="main-header" id="mainHeader">
    <div class="header-container">
      <div class="header-logo">
        <a href="index.html">
          <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <text x="0" y="30" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="28" fill="#C89F80">VRPL</text>
          </svg>
        </a>
      </div>
      <button class="menu-trigger" id="menuTrigger" aria-label="Open menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </header>

  <div class="overlay-menu" id="overlayMenu" aria-hidden="true">
    <div class="overlay-background" id="overlayBackground"></div>
    <div class="overlay-content">
      <button class="overlay-close" id="overlayClose">×</button>
      <nav class="overlay-nav">
        <ul class="overlay-menu-list">
          <li class="overlay-menu-item" data-image="assets/images/overlay/about.webp">
            <a href="about.html" class="overlay-link"><span class="link-number">01</span><span class="link-text">About Us</span></a>
          </li>
          <li class="overlay-menu-item" data-image="assets/images/overlay/home.webp">
            <a href="index.html" class="overlay-link"><span class="link-number">02</span><span class="link-text">Home</span></a>
          </li>
          <li class="overlay-menu-item" data-image="assets/images/overlay/blog.webp">
            <a href="blog.html" class="overlay-link"><span class="link-number">03</span><span class="link-text">Blog</span></a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <section class="blog-hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">VRPL Blog</h1>
      <p class="hero-subtitle">Latest insights on waste-to-energy technology and sustainability</p>
    </div>
  </section>

  <section class="blog-section">
    <div class="container">
      <div class="blog-layout">
        <div class="blog-main">
          <div class="blog-filters">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search posts..."
            >
            <select id="categoryFilter" class="filter-select">
              <option value="">All Categories</option>
            </select>
          </div>

          <div id="postsGrid" class="posts-grid">
            <p class="loading-text">Loading posts...</p>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>

        <aside class="blog-sidebar">
          <div class="sidebar-widget">
            <h3>Categories</h3>
            <ul id="categoriesList" class="categories-list">
              <li class="loading-text">Loading...</li>
            </ul>
          </div>

          <div class="sidebar-widget">
            <h3>Featured Post</h3>
            <div id="featuredPost" class="featured-widget">
              <p class="loading-text">Loading...</p>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script src="js/blog-public.js"></script>
</body>
</html>
